name: build-j4k-image

on:
  push:
    tags: ["v*-j4k.*"]

env:
  IMAGE: ghcr.io/jercik/forgejo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run fork integration tests
        run: |
          make 'test-sqlite#TestAPIPullReviewResolve'
          make 'test-sqlite#TestAPIPullReviewActionsUserPendingIsolation'
          make 'test-sqlite#TestVersion'
          make 'test-sqlite#TestActionsAPIRerunActionRun'
        env:
          TAGS: sqlite sqlite_unlock_notify
        timeout-minutes: 40

  build:
    needs: test
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history with tags: the in-container `git describe` derives
          # FORGEJO_VERSION from the checkout; a shallow clone stamps a bare
          # commit hash instead of the -j4k version.
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rootless
          platforms: ${{ matrix.platform }}
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,push=true
      - name: Gate on stamped version
        run: |
          out="$(docker run --rm --entrypoint /app/gitea/gitea \
            "$IMAGE@${{ steps.build.outputs.digest }}" --version)"
          echo "$out"
          echo "$out" | grep -F "${{ steps.version.outputs.version }}+gitea" \
            || { echo "version stamp missing -j4k suffix; refusing to tag"; exit 1; }
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ steps.version.outputs.version }}-rootless" \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Report pinnable digest
        run: |
          docker buildx imagetools inspect \
            "$IMAGE:${{ steps.version.outputs.version }}-rootless" | tee inspect.txt
          {
            echo '## Pinnable image reference'
            echo '```'
            echo "$IMAGE:${{ steps.version.outputs.version }}-rootless@$(grep -m1 '^Digest:' inspect.txt | awk '{print $2}')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
