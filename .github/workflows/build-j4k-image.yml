name: build-j4k-image

on:
  push:
    tags: ["v*-j4k.*"]

env:
  IMAGE: ghcr.io/jercik/forgejo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run fork tests
        shell: bash
        env:
          TAGS: sqlite sqlite_unlock_notify
        run: |
          # Every test a carry adds or modifies, and every upstream test of a
          # function a carry modifies, by its exact name, so that the job fails
          # when any one of them stops passing. A comment names the carried
          # function that an upstream test covers.
          integration=(
            TestAPIPullReviewResolve
            TestAPIPullReviewActionsUserPendingIsolation
            TestVersion
            TestActionsAPIRerunFailedJobs
            TestAPIGetActionJobLogs
            TestActionsDownloadTaskLogs # Logs
            TestActionsDownloadTaskRerunLogs # Logs
            TestActionsDownloadTaskLogsWithoutLogFile
            TestAPIBranchProtection # CreateBranchProtection, EditBranchProtection
            TestAPIBranchProtectionRejectsUnusableStatusCheckPattern
            TestProtectedBranch_RejectsUnusableStatusCheckPattern
          )
          unit=(
            TestFindReviews # FindReviewOptions.toCond
            TestGetCurrentReview # FindReviewOptions.toCond
            TestGetCurrentReviewActionsUser
            TestSubmitReviewActionsUserIsolation
            TestRerunFailedJobs
            TestCollectFailedRerunJobs
            Test_SaveAndGetManifestAndBlob # SaveAsPackageBlob, GetLocalBlob, processImageManifest
            TestSaveAsPackageBlobLostInsertRace
            TestSaveAsPackageBlobLostInsertRaceThenFailureKeepsWinnersContent
            TestSaveAsPackageBlobFailureRemovesOwnContent
            TestSaveAsPackageBlobDoesNotRetryAfterWritingContent
            TestProcessManifestLostVersionRace
            TestProcessManifestLostBlobRaceThenFailureKeepsWinnersContent
            TestProcessManifestLostOverwriteRaceOnExistingTag
            TestRelease_Create # CreateRelease
            TestRelease_insertRelease_TagSyncRace
            TestMergeRequiredContextsCommitStatus # MergeRequiredContextsCommitStatus
            TestMergeRequiredContextsCommitStatusBlocksOnUnusablePattern
            TestCompileStatusCheckPattern
            TestCompileStatusCheckPatternRejectsEveryPanickingPattern
            TestStatusCheckPatternMatch
            TestStatusCheckPatternMatchReturnsPanicAsError
          )

          alternation() { local IFS='|'; printf '%s' "$*"; }

          # One make call per target, because each `test#` call relinks every
          # package. Make pastes these variables into a shell command, so the
          # quotes stop `|` from becoming a pipe. `-v` prints the test names
          # that require_passed looks for.
          make test-sqlite GOTESTCOMPILEDRUNSUFFIX="-test.v -test.run '$(alternation "${integration[@]}")'" 2>&1 | tee "$RUNNER_TEMP/integration.log"
          make test-backend GOTESTFLAGS="-v -run '$(alternation "${unit[@]}")'" 2>&1 | tee "$RUNNER_TEMP/unit.log"

          # `go test -run` exits 0 when a pattern matches no test, and it matches
          # a name anywhere in a test name, so look for the whole name.
          failed=0
          require_passed() {
            local log=$1 name
            shift
            for name in "$@"; do
              if ! grep -E -- "^--- PASS: ${name} \(" "$log" >/dev/null; then
                echo "::error::no test named ${name} passed"
                failed=1
              fi
            done
          }
          require_passed "$RUNNER_TEMP/integration.log" "${integration[@]}"
          require_passed "$RUNNER_TEMP/unit.log" "${unit[@]}"
          exit "$failed"
        timeout-minutes: 40

  build:
    needs: test
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history with tags: the in-container `git describe` derives
          # FORGEJO_VERSION from the checkout; a shallow clone stamps a bare
          # commit hash instead of the -j4k version.
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rootless
          platforms: ${{ matrix.platform }}
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,push=true
      - name: Gate on stamped version
        run: |
          out="$(docker run --rm --entrypoint /app/gitea/gitea \
            "$IMAGE@${{ steps.build.outputs.digest }}" --version)"
          echo "$out"
          echo "$out" | grep -F "${{ steps.version.outputs.version }}+gitea" \
            || { echo "version stamp missing -j4k suffix; refusing to tag"; exit 1; }
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ steps.version.outputs.version }}-rootless" \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Report pinnable digest
        run: |
          docker buildx imagetools inspect \
            "$IMAGE:${{ steps.version.outputs.version }}-rootless" | tee inspect.txt
          {
            echo '## Pinnable image reference'
            echo '```'
            echo "$IMAGE:${{ steps.version.outputs.version }}-rootless@$(grep -m1 '^Digest:' inspect.txt | awk '{print $2}')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
